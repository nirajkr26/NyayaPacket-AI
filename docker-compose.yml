version: "3.8"

services:
  # 1. PostgreSQL Database (Neon compatible locally)
  postgres:
    image: postgres:16-alpine
    container_name: nyayapacket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nyayapacket
      POSTGRES_USER: nyaya_user
      POSTGRES_PASSWORD: nyaya_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya_user -d nyayapacket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Queue Broker (Upstash compatible locally)
  redis:
    image: redis:7-alpine
    container_name: nyayapacket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO S3 Object Storage (Neon Private S3 compatible locally)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: nyayapacket-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Backend Express API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nyayapacket-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://nyaya_user:nyaya_secure_password_2026@postgres:5432/nyayapacket?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET_NAME: nyayapacket-evidence
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: nyayapacket_super_secret_jwt_key_2026_at_least_32_characters_long
    ports:
      - "5000:5000"

  # 5. Background Processing Worker (OCR, Transcription, AI, PDF)
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nyayapacket-worker
    restart: unless-stopped
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nyaya_user:nyaya_secure_password_2026@postgres:5432/nyayapacket?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET_NAME: nyayapacket-evidence
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: "true"

  # 6. Frontend Client (Vite Nginx Static Server)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nyayapacket-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
